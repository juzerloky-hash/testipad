<?xml version="1.0" encoding="UTF-8"?>
<!-- Icoone méteo SVG - Compatible iOS 9.1 -->

<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
    <!-- Soleil -->
    <circle cx="64" cy="64" r="32" fill="#FDB717" opacity="0.9"/>

    <!-- Rayons du soleil (représentation stylisée) -->
    <g stroke="#FDB717" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6">
        <line x1="64" y1="8" x2="64" y2="16"/>
        <line x1="64" y1="112" x2="64" y2="104"/>
        <line x1="8" y1="64" x2="16" y2="64"/>
        <line x1="112" y1="64" x2="104" y2="64"/>
    </g>

    <!-- Nuage (optionnel - peut être masqué selon la condition) -->
    <ellipse cx="48" cy="56" rx="24" ry="12" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="72" cy="52" r="16" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="36" cy="64" r="18" fill="#FFFFFF" opacity="0.9"/>

    <!-- Pluie (optionnel) -->
    <g opacity="0">
        <path d="M 36 74 L 32 86 M 48 74 L 44 86 M 60 74 L 56 86" stroke="#52A9FF" stroke-width="2" fill="none"/>
    </g>

    <!-- Neige (optionnel) -->
    <g opacity="0">
        <path d="M 36 74 L 32 88 M 48 74 L 44 88 M 60 74 L 56 88" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    </g>
</svg>
